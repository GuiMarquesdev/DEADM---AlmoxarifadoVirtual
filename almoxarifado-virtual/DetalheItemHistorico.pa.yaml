Screens:
  DetalheItemHistorico:
    Properties:
      Fill: =ColorBg
      OnVisible: =Set(varHistoricoItem, Sort(Filter(colMovimentacoes, SKU = varItemSelecionado.SKU), DataHora, SortOrder.Descending))
    Children:
      - DetalheItemHistorico_TopBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =71
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingLeft: =24
            Width: =Parent.Width
          Children:
            - DetalheItemHistorico_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Histórico do Item"
      - DetalheItemHistorico_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            Icon: ="ArrowLeft"
            OnSelect: =Navigate(DetalheItem, ScreenTransition.None)
            Text: =" Voltar"
            Width: =164
            X: =1170
            Y: =15
      - DetalheItemHistorico_lblNome:
          Control: ModernText
          Properties:
            Color: =ColorTextPrimary
            FontWeight: =FontWeight.Bold
            Height: =45
            Size: =22
            Text: =varItemSelecionado.Nome
            Width: =262
            X: =35
            Y: =95
      - DetalheItemHistorico_lblMeta:
          Control: ModernText
          Properties:
            Color: =ColorTextSecondary
            Height: =37
            Size: =14
            Text: ="Código " & varItemSelecionado.SKU & " · " & varItemSelecionado.Categoria.Value & " · Unidade " & varItemSelecionado.UnidadeMedida
            Width: =223
            X: =35
            Y: =140
      - DetalheItemHistorico_tblHistorico:
          Control: Table
          Properties:
            Height: =520
            Items: =varHistoricoItem
            Width: =1302
            X: =35
            Y: =190
          Children:
            - DataHora1:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="DataHora"
                  FieldName: ="DataHora"
                  FieldType: ="d"
                  Order: =1
            - Tipo1:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Tipo"
                  FieldName: ="Tipo"
                  FieldType: ="s"
                  Order: =2
            - Quantidade3:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Quantidade"
                  FieldName: ="Quantidade"
                  FieldType: ="n"
                  Order: =3
            - DepositoOrigem1:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="DepositoOrigem"
                  FieldName: ="DepositoOrigem"
                  FieldType: ="s"
                  Order: =4
            - DepositoDestino1:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="DepositoDestino"
                  FieldName: ="DepositoDestino"
                  FieldType: ="s"
                  Order: =5
            - Usuario1:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Usuario"
                  FieldName: ="Usuario"
                  FieldType: ="s"
                  Order: =6
