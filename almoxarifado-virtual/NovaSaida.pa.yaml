Screens:
  NovaSaida:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Clear(colItensLancamentoSaida);
        Set(varMostrarAssinatura, false)
    Children:
      - NovaSaida_cboItem:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            InputTextPlaceholder: ="Selecione o item"
            ItemDisplayText: =ThisItem.Nome
            Items: =colItens
            Width: =456
            X: =25
            Y: =121
      - NovaSaida_btnConfirmar:
          Control: Button
          Properties:
            BasePaletteColor: =ColorAlert
            Height: =48
            OnSelect: |-
              =If(
                CountRows(colItensLancamentoSaida) = 0,
                Notify("Adicione pelo menos um item à lista antes de confirmar.", NotificationType.Error),
                If(
                  IsBlank(NovaSaida_cboDeposito.Selected) || IsBlank(NovaSaida_cboSetor.Selected),
                  Notify("Selecione o depósito e o setor solicitante.", NotificationType.Error),
                  Set(varGuiaCodigoAtual, "SAI-" & Left(GUID(), 8));
                  Set(varGuiaDeposito, NovaSaida_cboDeposito.Selected.Nome);
                  Set(varGuiaSetor, NovaSaida_cboSetor.Selected.Nome);
                  ForAll(
                    colItensLancamentoSaida As Linha,
                    Patch(Saldos, LookUp(Saldos, SKU = Linha.SKU && Deposito = NovaSaida_cboDeposito.Selected.Nome), {Quantidade: SaldoNoDeposito(Linha.SKU, NovaSaida_cboDeposito.Selected.Nome) - Linha.Quantidade});
                    Patch(Movimentacoes, Defaults(Movimentacoes), {Tipo: {Value: "Saída"}, SKU: Linha.SKU, ItemNome: Linha.Nome, DepositoOrigem: NovaSaida_cboDeposito.Selected.Nome, DepositoDestino: "", Quantidade: Linha.Quantidade, Motivo: NovaSaida_txtMotivo.Text, Solicitante: NovaSaida_cboSetor.Selected.Nome, Fornecedor: "", Usuario: varUsuarioAtual, DataHora: Now(), GuiaCodigo: varGuiaCodigoAtual})
                  );
                  Clear(colItensLancamentoSaida);
                  Set(varMostrarAssinatura, true)
                )
              )
            Text: ="Registrar Saída"
            Width: =456
            X: =848
            Y: =685
      - NovaSaida_txtMotivo:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: |-
              ="Ex.: Manutenção preventiva, obra setor 3..."
            Width: =456
            X: =25
            Y: =495
      - NovaSaida_lblMotivo:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Motivo da retirada"
            X: =25
            Y: =465
      - NovaSaida_cboSetor:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            InputTextPlaceholder: ="Selecione o setor"
            ItemDisplayText: =ThisItem.Nome
            Items: =colSetores
            Width: =456
            X: =25
            Y: =410
      - NovaSaida_lblSetor:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Setor solicitante"
            X: =25
            Y: =376
      - NovaSaida_galItensLista:
          Control: Gallery
          Variant: Vertical
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =540
            Items: =colItensLancamentoSaida
            TemplateSize: =48
            Width: =700
            X: =604
            Y: =121
          Children:
            - NovaSaida_lblItemLista:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextPrimary
                  Text: =ThisItem.Nome & " — " & Text(ThisItem.Quantidade) & " " & ThisItem.UnidadeMedida
                  Width: =620
                  Y: =12
            - NovaSaida_btnRemoverItemLista:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorAlert
                  Height: =36
                  Icon: ="Delete"
                  OnSelect: =RemoveIf(colItensLancamentoSaida, SKU = ThisItem.SKU)
                  Text: =""
                  Width: =36
                  X: =650
                  Y: =6
      - NovaSaida_lblItensLista:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Itens desta saída (" & CountRows(colItensLancamentoSaida) & ")"
            X: =603
            Y: =85
      - NovaSaida_btnAdicionarItem:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =44
            OnSelect: |-
              =If(
                IsBlank(NovaSaida_cboDeposito.Selected),
                Notify("Selecione o depósito de origem primeiro.", NotificationType.Error),
                If(
                  IsBlank(NovaSaida_cboItem.Selected) || NovaSaida_txtQuantidade.Value <= 0,
                  Notify("Selecione o item e uma quantidade válida.", NotificationType.Error),
                  If(
                    CountRows(Filter(colItensLancamentoSaida, SKU = NovaSaida_cboItem.Selected.SKU)) > 0,
                    Notify("Esse item já está na lista.", NotificationType.Error),
                    If(
                      NovaSaida_txtQuantidade.Value > SaldoNoDeposito(NovaSaida_cboItem.Selected.SKU, NovaSaida_cboDeposito.Selected.Nome),
                      Notify("Saldo insuficiente neste depósito.", NotificationType.Error),
                      Collect(colItensLancamentoSaida, {SKU: NovaSaida_cboItem.Selected.SKU, Nome: NovaSaida_cboItem.Selected.Nome, UnidadeMedida: NovaSaida_cboItem.Selected.UnidadeMedida, Quantidade: NovaSaida_txtQuantidade.Value});
                      Reset(NovaSaida_cboItem);
                      Reset(NovaSaida_txtQuantidade)
                    )
                  )
                )
              )
            Text: ="+ Adicionar item à lista"
            Width: =456
            X: =25
            Y: =568
      - NovaSaida_txtQuantidade:
          Control: ModernNumberInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            HintText: ="0"
            Width: =456
            X: =25
            Y: =322
      - NovaSaida_lblQuantidade:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Quantidade"
            X: =25
            Y: =277
      - NovaSaida_lblSaldoAtual:
          Control: ModernText
          Properties:
            Color: =ColorTextSecondary
            Height: =31
            Size: =13
            Text: |-
              =If(IsBlank(NovaSaida_cboItem.Selected) || IsBlank(NovaSaida_cboDeposito.Selected), "", "Saldo disponível neste depósito: " & Text(SaldoNoDeposito(NovaSaida_cboItem.Selected.SKU, NovaSaida_cboDeposito.Selected.Nome)))
            Width: =456
            X: =888
            Y: =718
      - NovaSaida_lblItem:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Item"
            X: =25
            Y: =85
      - NovaSaida_cboDeposito:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            InputTextPlaceholder: ="Selecione o depósito"
            ItemDisplayText: =ThisItem.Nome
            Items: =colDepositos
            Width: =456
            X: =25
            Y: =222
      - NovaSaida_lblDeposito:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Depósito de origem"
            X: =25
            Y: =181
      - NovaSaida_TopBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =69
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingLeft: =24
            Width: =Parent.Width
          Children:
            - NovaSaida_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Nova Saída de Material"
      - NovaSaida_OverlayAssinatura:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =800
            Visible: =varMostrarAssinatura
            Width: =1366
          Children:
            - NovaSaida_boxAssinatura:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(230, 230, 230, 1)
                  Height: =300
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =620
                  X: =373
                  Y: =120
                Children:
                  - NovaSaida_lblTituloAssinatura:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: ="Gerar guia — " & varGuiaCodigoAtual
                        Width: =572
                        X: =24
                        Y: =20
                  - NovaSaida_lblSubtituloAssinatura:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextSecondary
                        Height: =36
                        Size: =13
                        Text: ="Informe os dados de quem está retirando o material para gerar a guia."
                        Width: =572
                        X: =24
                        Y: =54
                  - NovaSaida_txtDestinatarioNome:
                      Control: ModernTextInput
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Placeholder: ="Nome de quem está recebendo"
                        Width: =572
                        X: =24
                        Y: =100
                  - NovaSaida_txtDestinatarioDocumento:
                      Control: ModernTextInput
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Placeholder: ="CPF ou matrícula"
                        Width: =572
                        X: =24
                        Y: =154
                  - NovaSaida_btnGerarPdf:
                      Control: Button
                      Properties:
                        BasePaletteColor: =ColorPrimary
                        Height: =44
                        OnSelect: |-
                          =If(
                            Trim(NovaSaida_txtDestinatarioNome.Text) = "" || Trim(NovaSaida_txtDestinatarioDocumento.Text) = "",
                            Notify("Informe o nome e o documento de quem está recebendo.", NotificationType.Error),
                            Set(varGuiaImpressaoCodigo, varGuiaCodigoAtual);
                            Set(varGuiaImpressaoDeposito, varGuiaDeposito);
                            Set(varGuiaImpressaoSetor, varGuiaSetor);
                            Set(varGuiaImpressaoDestinatarioNome, Trim(NovaSaida_txtDestinatarioNome.Text));
                            Set(varGuiaImpressaoDestinatarioDocumento, Trim(NovaSaida_txtDestinatarioDocumento.Text));
                            Patch(Guias, Defaults(Guias), {Codigo: varGuiaCodigoAtual, DataHora: Now(), Deposito: varGuiaDeposito, Setor: varGuiaSetor, DestinatarioNome: Trim(NovaSaida_txtDestinatarioNome.Text), DestinatarioDocumento: Trim(NovaSaida_txtDestinatarioDocumento.Text), Status: {Value: "Impresso"}});
                            Set(varMostrarAssinatura, false);
                            Navigate(GuiaImpressao, ScreenTransition.None)
                          )
                        Text: ="Gerar PDF para assinatura em papel"
                        Width: =572
                        X: =24
                        Y: =208
      - NovaSaida_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            OnSelect: =Navigate(Home, ScreenTransition.None)
            Text: ="< Voltar"
            Width: =90
            X: =1254
            Y: =14
