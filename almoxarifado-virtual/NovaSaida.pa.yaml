Screens:
  NovaSaida:
    Properties:
      Fill: =ColorBg
      OnVisible: =Clear(colItensLancamentoSaida)
    Children:
      - NovaSaida_txtItem:
          Control: ModernTextInput
          Properties:
            Color: =RGBA(0, 0, 0, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Digite o nome do item"
            Width: =456
            X: =25
            Y: =233
      - NovaSaida_btnConfirmar:
          Control: Button
          Properties:
            BasePaletteColor: =ColorAlert
            Height: =48
            OnSelect: |-
              =If(
                CountRows(colItensLancamentoSaida) = 0,
                Notify("Adicione pelo menos um item à lista antes de confirmar.", NotificationType.Error),
                If(
                  IsBlank(NovaSaida_cboDeposito.Selected) || IsBlank(NovaSaida_cboSetor.Selected),
                  Notify("Selecione o depósito e o setor solicitante.", NotificationType.Error),
                  ForAll(
                    colItensLancamentoSaida As Linha,
                    Patch(Saldos, LookUp(Saldos, SKU = Linha.SKU && Deposito = NovaSaida_cboDeposito.Selected.Nome), {Quantidade: SaldoNoDeposito(Linha.SKU, NovaSaida_cboDeposito.Selected.Nome) - Linha.Quantidade});
                    Patch(Movimentacoes, Defaults(Movimentacoes), {Tipo: {Value: "Saída"}, SKU: Linha.SKU, ItemNome: Linha.Nome, DepositoOrigem: NovaSaida_cboDeposito.Selected.Nome, DepositoDestino: "", Quantidade: Linha.Quantidade, Motivo: NovaSaida_txtMotivo.Text, Solicitante: NovaSaida_cboSetor.Selected.Nome, Fornecedor: "", Usuario: varUsuarioAtual, DataHora: Now()})
                  );
                  Clear(colItensLancamentoSaida);
                  Notify("Saída registrada com sucesso.", NotificationType.Success);
                  Navigate(Home, ScreenTransition.None)
                )
              )
            Text: ="Registrar Saída"
            Width: =456
            X: =888
            Y: =340
      - NovaSaida_txtMotivo:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: |-
              ="Ex.: Manutenção preventiva, obra setor 3..."
            Width: =456
            X: =888
            Y: =260
      - NovaSaida_lblMotivo:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Motivo da retirada"
            X: =888
            Y: =218
      - NovaSaida_cboSetor:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            InputTextPlaceholder: ="Selecione o setor"
            ItemDisplayText: =ThisItem.Nome
            Items: =colSetores
            Width: =456
            X: =888
            Y: =145
      - NovaSaida_lblSetor:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Setor solicitante"
            X: =888
            Y: =115
      - NovaSaida_galItensLista:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =269
            Items: =colItensLancamentoSaida
            TemplateSize: =48
            Width: =700
            X: =25
            Y: =480
          Children:
            - NovaSaida_lblItemLista:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextPrimary
                  Text: =ThisItem.Nome & " — " & Text(ThisItem.Quantidade) & " " & ThisItem.UnidadeMedida
                  Width: =620
                  Y: =12
            - NovaSaida_btnRemoverItemLista:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorAlert
                  Height: =36
                  Icon: ="Delete"
                  OnSelect: =RemoveIf(colItensLancamentoSaida, SKU = ThisItem.SKU)
                  Text: =""
                  Width: =36
                  X: =650
                  Y: =6
      - NovaSaida_lblItensLista:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Itens desta saída (" & CountRows(colItensLancamentoSaida) & ")"
            X: =25
            Y: =450
      - NovaSaida_btnAdicionarItem:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =44
            OnSelect: |-
              =If(
                IsBlank(NovaSaida_cboDeposito.Selected),
                Notify("Selecione o depósito de origem primeiro.", NotificationType.Error),
                If(
                  Trim(NovaSaida_txtItem.Text) = "" || NovaSaida_txtQuantidade.Value <= 0,
                  Notify("Digite o nome do item e uma quantidade válida.", NotificationType.Error),
                  If(
                    CountRows(Filter(colItensLancamentoSaida, Nome = Trim(NovaSaida_txtItem.Text))) > 0,
                    Notify("Esse item já está na lista.", NotificationType.Error),
                    If(
                      NovaSaida_txtQuantidade.Value > SaldoNoDeposito(Trim(NovaSaida_txtItem.Text), NovaSaida_cboDeposito.Selected.Nome),
                      Notify("Saldo insuficiente neste depósito.", NotificationType.Error),
                      Collect(colItensLancamentoSaida, {SKU: Trim(NovaSaida_txtItem.Text), Nome: Trim(NovaSaida_txtItem.Text), UnidadeMedida: "un", Quantidade: NovaSaida_txtQuantidade.Value});
                      Reset(NovaSaida_txtItem);
                      Reset(NovaSaida_txtQuantidade)
                    )
                  )
                )
              )
            Text: ="+ Adicionar item à lista"
            Width: =456
            X: =25
            Y: =388
      - NovaSaida_txtQuantidade:
          Control: ModernNumberInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            HintText: ="0"
            Width: =456
            X: =25
            Y: =322
      - NovaSaida_lblQuantidade:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Quantidade"
            X: =25
            Y: =277
      - NovaSaida_lblSaldoAtual:
          Control: ModernText
          Properties:
            Color: =ColorTextSecondary
            Height: =31
            Size: =13
            Text: |-
              =If(Trim(NovaSaida_txtItem.Text) = "" || IsBlank(NovaSaida_cboDeposito.Selected), "", "Saldo disponível neste depósito: " & Text(SaldoNoDeposito(Trim(NovaSaida_txtItem.Text), NovaSaida_cboDeposito.Selected.Nome)))
            Width: =456
            X: =888
            Y: =718
      - NovaSaida_lblItem:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Item"
            X: =25
            Y: =204
      - NovaSaida_cboDeposito:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            InputTextPlaceholder: ="Selecione o depósito"
            ItemDisplayText: =ThisItem.Nome
            Items: =colDepositos
            Width: =456
            X: =25
            Y: =145
      - NovaSaida_lblDeposito:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            FontWeight: =FontWeight.Semibold
            Size: =14
            Text: ="Depósito de origem"
            X: =25
            Y: =115
      - NovaSaida_TopBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =69
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingLeft: =24
            Width: =Parent.Width
          Children:
            - NovaSaida_btnVoltar:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =RGBA(255,255,255,1)
                  Height: =40
                  OnSelect: =Navigate(Home, ScreenTransition.None)
                  Text: ="< Voltar"
                  Width: =90
            - NovaSaida_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Nova Saída de Material"
