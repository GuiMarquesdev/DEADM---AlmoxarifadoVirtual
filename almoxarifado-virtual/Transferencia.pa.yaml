Screens:
  Transferencia:
    Properties:
      Fill: =ColorBg
    Children:
      - Transferencia_FormCard:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =700
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =32
            PaddingLeft: =32
            PaddingRight: =32
            PaddingTop: =32
            Width: =1366
            Y: =68
          Children:
            - Transferencia_lblItem:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(0, 0, 0, 1)
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="Item"
            - Transferencia_cboItem:
                Control: ModernCombobox
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =44
                  InputTextPlaceholder: ="Selecione o item"
                  ItemDisplayText: =ThisItem.Nome
                  Items: =colItens
                  Width: =456
            - Transferencia_lblOrigem:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextSecondary
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="Depósito de origem"
            - Transferencia_cboOrigem:
                Control: ModernCombobox
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =44
                  InputTextPlaceholder: ="Selecione a origem"
                  ItemDisplayText: =ThisItem.Nome
                  Items: =colDepositos
                  Width: =456
            - Transferencia_lblSaldoOrigem:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextSecondary
                  Size: =13
                  Text: |-
                    =If(IsBlank(Transferencia_cboItem.Selected) || IsBlank(Transferencia_cboOrigem.Selected), "", "Saldo disponível na origem: " & Text(SaldoNoDeposito(Transferencia_cboItem.Selected.SKU, Transferencia_cboOrigem.Selected.Nome)))
            - Transferencia_lblDestino:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextSecondary
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="Depósito de destino"
            - Transferencia_cboDestino:
                Control: ModernCombobox
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =44
                  InputTextPlaceholder: ="Selecione o destino"
                  ItemDisplayText: =ThisItem.Nome
                  Items: =colDepositos
                  Width: =456
            - Transferencia_lblMotivo:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextSecondary
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="Motivo da transferência"
            - Transferencia_txtMotivo:
                Control: ModernTextInput
                Properties:
                  Color: =RGBA(0, 0, 0, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =44
                  Placeholder: |-
                    ="Ex.: Reposição, reorganização de estoque..."
                  Width: =456
            - Transferencia_lblQuantidade:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextSecondary
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="Quantidade"
            - Transferencia_txtQuantidade:
                Control: ModernNumberInput
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =44
                  HintText: ="0"
                  Width: =456
            - Transferencia_btnConfirmar:
                Control: Button
                Properties:
                  BasePaletteColor: =ColorPrimaryDark
                  Height: =48
                  OnSelect: |-
                    =With(
                      {saldoOrigem: If(IsBlank(Transferencia_cboItem.Selected) || IsBlank(Transferencia_cboOrigem.Selected), 0, SaldoNoDeposito(Transferencia_cboItem.Selected.SKU, Transferencia_cboOrigem.Selected.Nome))},
                      If(
                        IsBlank(Transferencia_cboItem.Selected) || IsBlank(Transferencia_cboOrigem.Selected) || IsBlank(Transferencia_cboDestino.Selected) || Transferencia_txtQuantidade.Value <= 0,
                        Notify("Preencha item, depósito de origem, depósito de destino e uma quantidade válida.", NotificationType.Error),
                        If(
                          Transferencia_cboOrigem.Selected.Nome = Transferencia_cboDestino.Selected.Nome,
                          Notify("O depósito de origem e destino devem ser diferentes.", NotificationType.Error),
                          If(
                            Transferencia_txtQuantidade.Value > saldoOrigem,
                            Notify("Saldo insuficiente no depósito de origem. Saldo atual: " & Text(saldoOrigem), NotificationType.Error),
                            Patch(Saldos, LookUp(Saldos, SKU = Transferencia_cboItem.Selected.SKU && Deposito = Transferencia_cboOrigem.Selected.Nome), {Quantidade: saldoOrigem - Transferencia_txtQuantidade.Value});
                            With(
                              {existenteDestino: LookUp(Saldos, SKU = Transferencia_cboItem.Selected.SKU && Deposito = Transferencia_cboDestino.Selected.Nome)},
                              If(
                                IsBlank(existenteDestino),
                                Patch(Saldos, Defaults(Saldos), {SKU: Transferencia_cboItem.Selected.SKU, Deposito: Transferencia_cboDestino.Selected.Nome, Quantidade: Transferencia_txtQuantidade.Value}),
                                Patch(Saldos, existenteDestino, {Quantidade: existenteDestino.Quantidade + Transferencia_txtQuantidade.Value})
                              )
                            );
                            Patch(Movimentacoes, Defaults(Movimentacoes), {Tipo: {Value: "Transferência"}, SKU: Transferencia_cboItem.Selected.SKU, ItemNome: Transferencia_cboItem.Selected.Nome, DepositoOrigem: Transferencia_cboOrigem.Selected.Nome, DepositoDestino: Transferencia_cboDestino.Selected.Nome, Quantidade: Transferencia_txtQuantidade.Value, Motivo: Transferencia_txtMotivo.Text, Solicitante: "", Fornecedor: "", Usuario: varUsuarioAtual, DataHora: Now()});
                            Notify("Transferência registrada com sucesso.", NotificationType.Success);
                            Navigate(Home, ScreenTransition.None)
                          )
                        )
                      )
                    )
                  Text: ="Confirmar Transferência"
                  Width: =456
      - Transferencia_TopBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =68
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingLeft: =24
            Width: =Parent.Width
          Children:
            - Transferencia_btnVoltar:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =RGBA(255,255,255,1)
                  Height: =40
                  OnSelect: =Navigate(Home, ScreenTransition.None)
                  Text: ="< Voltar"
                  Width: =90
            - Transferencia_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Transferência entre Depósitos"
