                        Size: =11
                        Text: |-
                          ="DATA:  ____ / ____ / ______"
                        Width: =400
                        X: =30
                        Y: =88
            - GuiaImpressao_lblOrgao:
                Control: ModernText
                Properties:
                  Color: =ColorPrimaryDark
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =16
                  Text: ="MINISTÉRIO PÚBLICO DO ESTADO DA BAHIA"
                  Width: =520
