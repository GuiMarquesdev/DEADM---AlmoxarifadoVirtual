Screens:
  GuiaImpressao:
    Properties:
      Fill: =RGBA(230, 230, 230, 1)
      OnVisible: =Set(varItensGuiaImpressao, Filter(colMovimentacoes, GuiaCodigo = varGuiaImpressaoCodigo))
    Children:
      - GuiaImpressao_NavBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =71
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutWrap: =true
            PaddingLeft: =24
            PaddingRight: =24
            Width: =1366
          Children:
            - GuiaImpressao_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Guia pronta para impressão"
      - GuiaImpressao_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            OnSelect: =Navigate(NovaSaida, ScreenTransition.None)
            Text: ="< Voltar"
            Width: =120
            X: =1220
            Y: =15
      - GuiaImpressao_btnBaixarPdf:
          Control: Button
          Properties:
            BasePaletteColor: =ColorPrimary
            Height: =40
            OnSelect: |-
              =Set(varGuiaImpressaoPdf, PDF(GuiaImpressao_Conteudo));
              Download(varGuiaImpressaoPdf)
            Text: ="Baixar / Imprimir PDF"
            Width: =220
            X: =990
            Y: =16
      - GuiaImpressao_Conteudo:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorBorder
            BorderThickness: =1
            DropShadow: =DropShadow.Bold
            Fill: =RGBA(255, 255, 255, 1)
            Height: =683
            Width: =1366
            Y: =85
          Children:
            - GuiaImpressao_lblTituloGuia:
                Control: ModernText
                Properties:
                  Align: =Align.Right
                  Color: =ColorPrimaryDark
                  FontWeight: =FontWeight.Bold
                  Height: =50
                  Size: =28
                  Text: ="Guia de Entrega"
                  Width: =500
                  X: =826
                  Y: =5
            - GuiaImpressao_lblPagina:
                Control: ModernText
                Properties:
                  Align: =Align.Right
                  Color: =ColorTextSecondary
                  Height: =27
                  Size: =12
                  Text: |-
                    ="Página: 1 de 1"
                  Width: =500
                  X: =826
                  Y: =68
            - GuiaImpressao_tblItens:
                Control: Table
                Properties:
                  Height: =190
                  Items: =varItensGuiaImpressao
                  Width: =1286
                  X: =40
                  Y: =252
                Children:
                  - GuiaImpressaoSKU:
                      Control: TableDataField
                      Variant: textualColumn
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Código"
                        FieldName: ="SKU"
                        FieldType: ="s"
                        Order: =1
                  - GuiaImpressaoItemNome:
                      Control: TableDataField
                      Variant: textualColumn
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Item"
                        FieldName: ="ItemNome"
                        FieldType: ="s"
                        Order: =2
                  - GuiaImpressaoQtdeSolicitada:
                      Control: TableDataField
                      Variant: textualColumn
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Qtde Solicitada"
                        FieldName: ="Quantidade"
                        FieldType: ="n"
                        Order: =3
                  - GuiaImpressaoQtdeAtendida:
                      Control: TableDataField
                      Variant: textualColumn
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Qtde Atendida"
                        FieldName: ="Quantidade"
                        FieldType: ="n"
                        Order: =4
                  - GuiaImpressaoObservacao:
                      Control: TableDataField
                      Variant: textualColumn
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Observação"
                        FieldName: ="Motivo"
                        FieldType: ="s"
                        Order: =5
            - GuiaImpressao_lblDataEmissao:
                Control: ModernText
                Properties:
                  Align: =Align.Right
                  Color: =ColorTextSecondary
                  Height: =28
                  Size: =12
                  Text: |-
                    ="Data de Emissão: " & Text(Now(), "dd/mm/yyyy")
                  Width: =500
                  X: =826
                  Y: =50
            - GuiaImpressao_lblRodape:
                Control: ModernText
                Properties:
                  Align: =Align.Center
                  Color: =ColorTextSecondary
                  Height: =14
                  Size: =9
                  Text: ="Documento gerado eletronicamente pelo Almoxarifado Virtual."
                  Width: =1286
                  X: =40
                  Y: =650
            - GuiaImpressao_lblItensHeader:
                Control: ModernText
                Properties:
                  Color: =ColorPrimaryDark
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =12
                  Text: ="ITENS DA REMESSA"
                  Width: =300
                  X: =40
                  Y: =214
            - GuiaImpressao_retAccentBar:
                Control: Rectangle
                Properties:
                  Fill: =ColorPrimary
                  Height: =3
                  Width: =1286
                  X: =40
                  Y: =97
            - GuiaImpressao_iconOrgao:
                Control: Icon
                Properties:
                  Height: =36
                  Icon: ="BuildingGovernment"
                  IconColor: =ColorPrimaryDark
                  Width: =36
                  X: =40
                  Y: =20
            - GuiaImpressao_boxMeta:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorBorder
                  BorderThickness: =1
                  Fill: =ColorBg
                  Height: =102
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =1286
                  X: =40
                  Y: =108
                Children:
                  - GuiaImpressao_lblGuiaNumLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =12
                        Text: ="Guia de Entrega Nº:"
                        Width: =180
                        X: =24
                        Y: =3
                  - GuiaImpressao_lblGuiaNumValue:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        Height: =18
                        Size: =12
                        Text: =varGuiaImpressaoCodigo
                        Width: =200
                        X: =210
                        Y: =14
                  - GuiaImpressao_lblDataEntregaLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =29
                        Size: =12
                        Text: ="Data de Entrega:"
                        Width: =160
                        X: =450
                        Y: =3
                  - GuiaImpressao_lblDataEntregaValue:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        Height: =29
                        Size: =12
                        Text: =Text(Now(), "dd/mm/yyyy")
                        Width: =160
                        X: =616
                        Y: =3
                  - GuiaImpressao_lblOrgaoUnidLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =12
                        Text: ="Órgão/Unidade:"
                        X: =24
                        Y: =40
                  - GuiaImpressao_lblOrgaoUnidValue:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        Height: =26
                        Size: =12
                        Text: |-
                          =varGuiaImpressaoSetor & "  —  Depósito: " & varGuiaImpressaoDeposito
                        Width: =700
                        X: =180
                        Y: =40
                  - GuiaImpressao_lblSolicitanteLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =31
                        Size: =12
                        Text: ="Solicitante:"
                        Width: =110
                        X: =24
                        Y: =66
                  - GuiaImpressao_lblSolicitanteValue:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextPrimary
                        Height: =18
                        Size: =12
                        Text: =varGuiaImpressaoDestinatarioNome
                        Width: =700
                        X: =140
                        Y: =66
            - GuiaImpressao_boxPreparado:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorBorder
                  BorderThickness: =1
                  Fill: =ColorBg
                  Height: =143
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =623
                  X: =40
                  Y: =500
                Children:
                  - GuiaImpressao_lblPreparadoPor:
                      Control: ModernText
                      Properties:
                        Color: =ColorPrimaryDark
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =12
