                  Y: =242
            - GuiaImpressao_boxRecebido:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorBorder
                  BorderThickness: =1
                  Fill: =ColorBg
                  Height: =143
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =623
                  X: =703
                  Y: =500
                Children:
                  - GuiaImpressao_lblRecebidoPor:
                      Control: ModernText
                      Properties:
                        Color: =ColorPrimaryDark
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =12
                        Text: ="RECEBIDO POR"
                        Width: =400
                        X: =30
                        Y: =16
                  - GuiaImpressao_retLinhaRecebido:
                      Control: Rectangle
                      Properties:
                        Fill: =ColorTextPrimary
