Screens:
  DetalheDeposito:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varSaldosDeposito, Filter(colSaldos, Deposito = varDepositoSelecionado.Nome));
        Set(varItensDeposito, AddColumns(varSaldosDeposito, "Nome", LookUp(colItens, SKU = SKU).Nome, "Categoria", LookUp(colItens, SKU = SKU).Categoria))
    Children:
      - DetalheDeposito_Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =ColorBg
          Children:
            - DetalheDeposito_TopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  Width: =Parent.Width
                  Height: =64
                  FillPortions: =0
                  PaddingLeft: =24
                  LayoutGap: =16
                  Fill: =ColorPrimaryDark
                Children:
                  - DetalheDeposito_btnVoltar:
                      Control: Button
                      Properties:
                        Text: ="< Voltar"
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =RGBA(255,255,255,1)
                        Width: =90
                        Height: =40
                        FillPortions: =0
                        OnSelect: =Navigate(Depositos, ScreenTransition.None)
                  - DetalheDeposito_lblAppTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Detalhe do Depósito"
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Color: =RGBA(255,255,255,1)
                        AutoHeight: =true
            - DetalheDeposito_Content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  Width: =Parent.Width
                  FillPortions: =0
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  PaddingBottom: =32
                Children:
                  - DetalheDeposito_lblNome:
                      Control: ModernText
                      Properties:
                        Text: =varDepositoSelecionado.Nome
                        FontWeight: =FontWeight.Bold
                        Size: =26
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - DetalheDeposito_lblMeta:
                      Control: ModernText
                      Properties:
                        Text: |-
                          ="Responsável: " & varDepositoSelecionado.Responsavel & " · Saldo total: " & Text(DepositoSaldoTotal(varDepositoSelecionado.Nome)) & " unidades"
                        Size: =14
                        Color: =ColorTextSecondary
                        AutoHeight: =true
                  - DetalheDeposito_lblItensHeader:
                      Control: ModernText
                      Properties:
                        Text: ="Itens armazenados"
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - DetalheDeposito_tblItens:
                      Control: Table
                      Properties:
                        Items: =varItensDeposito
                        Width: =Parent.Width
                        Height: =CountRows(varItensDeposito) * 48 + 48
                        FillPortions: =0
