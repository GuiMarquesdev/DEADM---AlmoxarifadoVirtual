Screens:
  DetalheDeposito:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varSaldosDeposito, Filter(colSaldos, Deposito = varDepositoSelecionado.Nome));
        Set(varConfirmandoQuantidade, false);
        Set(varConfirmandoExclusaoSaldo, false)
    Children:
      - DetalheDeposito_lblItensHeader:
          Control: ModernText
          Properties:
            AutoHeight: =true
            FontWeight: =FontWeight.Semibold
            Size: =20
            Text: ="Itens armazenados"
            Width: =273
            X: =35
            Y: =268
      - DetalheDeposito_lblMeta:
          Control: ModernText
          Properties:
            Color: =ColorTextSecondary
            Height: =55
            Size: =14
            Text: |-
              ="Responsável: " & varDepositoSelecionado.Responsavel & " · Saldo total: " & Text(DepositoSaldoTotal(varDepositoSelecionado.Nome)) & " unidades"
            Width: =376
            X: =20
            Y: =153
      - DetalheDeposito_lblNome:
          Control: ModernText
          Properties:
            AccessibleLabel: =
            Color: =RGBA(0, 0, 0, 1)
            FontWeight: =FontWeight.Bold
            Height: =79
            Size: =26
            Text: ="Estoque no Cassange"
            Width: =351
            X: =35
            Y: =94
      - DetalheDeposito_TopBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =73
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingLeft: =24
            Width: =Parent.Width
          Children:
            - DetalheDeposito_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Detalhe do Depósito"
      - DetalheDeposito_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            Icon: ="ArrowLeft"
            OnSelect: =Navigate(Depositos, ScreenTransition.None)
            Text: =" Voltar"
            Width: =156
            X: =1180
            Y: =16
      - DetalheDeposito_galItens:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =440
            Items: =varSaldosDeposito
            TemplateSize: =64
            Width: =1335
            X: =20
            Y: =306
          Children:
            - DetalheDeposito_cardItem:
                Control: ModernCard
                Properties:
                  BorderRadius: =8
                  Fill: =ColorCard
                  HeaderImage: =Blank()
                  Height: =56
                  Image: =Blank()
                  Subtitle: ="Código " & ThisItem.SKU & " · " & LookUp(colItens, SKU = ThisItem.SKU).Categoria.Value
                  Title: =LookUp(colItens, SKU = ThisItem.SKU).Nome
                  Width: =680
                  Y: =4
            - DetalheDeposito_txtQuantidadeItem:
                Control: ModernNumberInput
                Properties:
                  Default: =ThisItem.Quantidade
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =44
                  HintText: ="Quantidade"
                  Min: =0
                  OnChange: |-
                    =If(
                      Self.Value <> ThisItem.Quantidade,
                      Set(varItemQuantEditando, ThisItem);
                      Set(varNomeItemEditando, LookUp(colItens, SKU = ThisItem.SKU).Nome);
                      Set(varUnidadeItemEditando, LookUp(colItens, SKU = ThisItem.SKU).UnidadeMedida);
                      Set(varQuantidadeAnterior, ThisItem.Quantidade);
                      Set(varQuantidadeNova, Self.Value);
                      Set(varConfirmandoQuantidade, true)
                    )
                  Width: =140
                  X: =700
                  Y: =10
            - DetalheDeposito_badgeStatusItem:
                Control: Badge
                Properties:
                  Content: =If(ThisItem.Quantidade < LookUp(colItens, SKU = ThisItem.SKU).EstoqueMinimo, "Baixo", "OK")
                  Height: =28
                  ThemeColor: =If(ThisItem.Quantidade < LookUp(colItens, SKU = ThisItem.SKU).EstoqueMinimo, 'BadgeCanvas.ThemeColor'.Danger, 'BadgeCanvas.ThemeColor'.Success)
                  Width: =80
                  X: =1040
                  Y: =18
            - DetalheDeposito_dtValidadeItem:
                Control: ModernDatePicker
                Properties:
                  DefaultDate: =ThisItem.DataValidade
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =44
                  OnChange: |-
                    =Patch(Saldos, ThisItem, {DataValidade: Self.SelectedDate});
                    Set(varSaldosDeposito, Filter(colSaldos, Deposito = varDepositoSelecionado.Nome));
                    Notify("Data de validade atualizada.", NotificationType.Success)
                  Placeholder: ="Validade"
                  Width: =140
                  X: =874
                  Y: =10
            - DetalheDeposito_badgeValidadeItem:
                Control: Badge
                Properties:
                  Content: =StatusValidade(ThisItem.DataValidade)
                  Height: =28
                  ThemeColor: =If(StatusValidade(ThisItem.DataValidade) = "Vencido", 'BadgeCanvas.ThemeColor'.Danger, StatusValidade(ThisItem.DataValidade) = "Vence em breve", 'BadgeCanvas.ThemeColor'.Warning, 'BadgeCanvas.ThemeColor'.Success)
                  Visible: =!IsBlank(ThisItem.DataValidade)
                  Width: =110
                  X: =1120
                  Y: =14
            - DetalheDeposito_btnExcluirSaldo:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorAlert
                  Height: =44
                  Icon: ="Delete"
                  OnSelect: |-
                    =Set(varItemSaldoParaExcluir, ThisItem);
                    Set(varConfirmandoExclusaoSaldo, true)
                  Text: =""
                  Width: =44
                  X: =1260
                  Y: =6
      - DetalheDeposito_OverlayQuantidade:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =800
            Visible: =varConfirmandoQuantidade
            Width: =1366
          Children:
            - DetalheDeposito_boxConfirmarQuantidade:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =ColorCard
                  Height: =280
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =460
                  X: =453
                  Y: =250
                Children:
                  - DetalheDeposito_lblTituloQuantidade:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: ="Confirmar ajuste de saldo?"
                        Width: =412
                        X: =24
                        Y: =20
                  - DetalheDeposito_lblMensagemQuantidade:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextSecondary
                        Height: =140
                        Size: =14
                        Text: |-
                          ="Você está alterando manualmente o saldo de """ & varNomeItemEditando & """ neste depósito: de " & varQuantidadeAnterior & " para " & varQuantidadeNova & " " & varUnidadeItemEditando & ". Essa ação ajusta o estoque diretamente e NÃO gera um registro de movimentação (diferente de Entrada, Saída ou Transferência). Use apenas para corrigir divergências de inventário."
                        Width: =412
                        X: =24
                        Y: =56
                  - DetalheDeposito_btnCancelarQuantidade:
                      Control: Button
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        Height: =44
                        OnSelect: |-
                          =Set(varConfirmandoQuantidade, false);
                          Set(varSaldosDeposito, Filter(colSaldos, Deposito = varDepositoSelecionado.Nome))
                        Text: ="Cancelar"
                        Width: =198
                        X: =24
                        Y: =218
                  - DetalheDeposito_btnConfirmarQuantidade:
                      Control: Button
                      Properties:
                        BasePaletteColor: =ColorPrimary
                        Height: =44
                        OnSelect: |-
                          =Patch(Saldos, varItemQuantEditando, {Quantidade: varQuantidadeNova});
                          Set(varConfirmandoQuantidade, false);
                          Notify("Quantidade atualizada.", NotificationType.Success)
                        Text: ="Confirmar"
                        Width: =198
                        X: =238
                        Y: =218
      - Label1:
          Control: Label
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =25
            Text: |-
              ="Qunatidade
              "
            Width: =136
            X: =720
            Y: =281
      - Label2:
          Control: Label
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =31
            Text: ="Validade do Lote"
            X: =891
            Y: =278
      - DetalheDeposito_OverlayExcluirSaldo:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =800
            Visible: =varConfirmandoExclusaoSaldo
            Width: =1366
          Children:
            - DetalheDeposito_boxConfirmarExclusaoSaldo:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =ColorCard
                  Height: =230
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =460
                  X: =453
                  Y: =280
                Children:
                  - DetalheDeposito_lblTituloExcluirSaldo:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: ="Excluir este saldo?"
                        Width: =412
                        X: =24
                        Y: =20
                  - DetalheDeposito_lblMensagemExcluirSaldo:
                      Control: ModernText
                      Properties:
                        Color: =ColorTextSecondary
                        Height: =90
                        Size: =14
                        Text: |-
                          ="Isso vai remover permanentemente o registro de saldo de """ & LookUp(colItens, SKU = varItemSaldoParaExcluir.SKU).Nome & """ neste depósito (Código " & varItemSaldoParaExcluir.SKU & "). O item continua existindo no catálogo. Essa ação não pode ser desfeita."
                        Width: =412
                        X: =24
                        Y: =56
                  - DetalheDeposito_btnCancelarExclusaoSaldo:
                      Control: Button
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        Height: =44
                        OnSelect: =Set(varConfirmandoExclusaoSaldo, false)
                        Text: ="Cancelar"
                        Width: =198
                        X: =24
                        Y: =170
                  - DetalheDeposito_btnConfirmarExclusaoSaldo:
                      Control: Button
                      Properties:
                        BasePaletteColor: =ColorAlert
                        Height: =44
                        OnSelect: |-
                          =RemoveIf(Saldos, ID = varItemSaldoParaExcluir.ID);
                          Set(varConfirmandoExclusaoSaldo, false);
                          Set(varSaldosDeposito, Filter(colSaldos, Deposito = varDepositoSelecionado.Nome));
                          Notify("Saldo excluído.", NotificationType.Success)
                        Text: ="Excluir mesmo assim"
                        Width: =198
                        X: =238
                        Y: =170
