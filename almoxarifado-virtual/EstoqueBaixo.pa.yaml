Screens:
  EstoqueBaixo:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varItensBaixoEstoque, Filter(colItens, ItemEstoqueBaixo(SKU)));
        Set(varDepositoFiltroBaixo, Blank())
    Children:
      - EstoqueBaixo_TopBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =71
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingLeft: =24
            Width: =Parent.Width
          Children:
            - EstoqueBaixo_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Estoque Baixo"
      - EstoqueBaixo_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            Icon: ="ArrowLeft"
            OnSelect: =Navigate(Home, ScreenTransition.None)
            Text: =" Voltar"
            Width: =164
            X: =1170
            Y: =15
      - EstoqueBaixo_lblHeader:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextPrimary
            FontWeight: =FontWeight.Bold
            Size: =28
            Text: ="Itens com estoque abaixo do mínimo"
            Width: =900
            X: =35
            Y: =95
      - EstoqueBaixo_lblSubheader:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextSecondary
            Size: =14
            Text: ="(" & CountRows(varItensBaixoEstoque) & ") itens precisam de reposição"
            Width: =700
            X: =35
            Y: =140
      - EstoqueBaixo_cboDeposito:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =40
            InputTextPlaceholder: ="Ver saldo num depósito específico (opcional)"
            ItemDisplayText: =ThisItem.Nome
            Items: =colDepositos
            OnChange: =Set(varDepositoFiltroBaixo, If(IsBlank(Self.Selected), Blank(), Self.Selected.Nome))
            Width: =340
            X: =35
            Y: =172
      - EstoqueBaixo_btnLimparFiltroDeposito:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =40
            OnSelect: |-
              =Set(varDepositoFiltroBaixo, Blank());
              Reset(EstoqueBaixo_cboDeposito)
            Text: ="Limpar"
            Width: =90
            X: =385
            Y: =172
      - EstoqueBaixo_galAlertas:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =476
            Items: =varItensBaixoEstoque
            TemplateSize: =88
            Width: =1302
            X: =35
            Y: =224
          Children:
            - EstoqueBaixo_cardAlerta:
                Control: ModernCard
                Properties:
                  BorderRadius: =8
                  DropShadow: =DropShadow.Semibold
                  Fill: =ColorCard
                  HeaderImage: =Blank()
                  Height: =76
                  Image: =Blank()
                  OnSelect: |-
                    =Set(varItemSelecionado, ThisItem);
                    Navigate(DetalheItem, ScreenTransition.None)
                  Subtitle: |-
                    ="Código " & ThisItem.SKU & " · Saldo total " & Text(ItemSaldoTotal(ThisItem.SKU)) & " " & ThisItem.UnidadeMedida & " (mínimo " & Text(ThisItem.EstoqueMinimo) & ")" & If(!IsBlank(varDepositoFiltroBaixo), " · Em " & varDepositoFiltroBaixo & ": " & Text(SaldoNoDeposito(ThisItem.SKU, varDepositoFiltroBaixo)) & " " & ThisItem.UnidadeMedida, "")
                  Title: =ThisItem.Nome
                  Width: =1276
            - EstoqueBaixo_badgeAlerta:
                Control: Badge
                Properties:
                  Content: ="Baixo"
                  Height: =28
                  ThemeColor: ='BadgeCanvas.ThemeColor'.Danger
                  Width: =70
                  X: =1084
                  Y: =24
            - EstoqueBaixo_btnRepor:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorPrimary
                  Height: =44
                  Icon: ="Add"
                  OnSelect: =Navigate(NovaEntrada, ScreenTransition.None)
                  Text: =""
                  Width: =44
                  X: =1165
                  Y: =16
            - EstoqueBaixo_btnTransferir:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorPrimary
                  Height: =44
                  Icon: ="ArrowSync"
                  OnSelect: =Navigate(Transferencia, ScreenTransition.None)
                  Text: =""
                  Width: =44
                  X: =1209
                  Y: =16
