Screens:
  Dashboard:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varItensBaixoEstoque, Filter(colItens, ItemEstoqueBaixo(SKU)));
        Set(varTotalItens, CountRows(colItens));
        Set(varTotalDepositos, CountRows(colDepositos))
    Children:
      - Dashboard_Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =ColorBg
          Children:
            - Dashboard_NavBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  Width: =Parent.Width
                  Height: =64
                  FillPortions: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                  Fill: =ColorPrimaryDark
                Children:
                  - Dashboard_lblAppTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Almoxarifado Virtual"
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Color: =RGBA(255,255,255,1)
                        AutoHeight: =true
                  - Dashboard_navTabs:
                      Control: ModernTabList
                      Properties:
                        Items: |-
                          =Table({Value: "Dashboard"}, {Value: "Catálogo"}, {Value: "Depósitos"}, {Value: "Histórico"}, {Value: "Cadastros"})
                        Default: '={Value: "Dashboard"}'
                        Width: =520
                        Height: =40
                        FillPortions: =0
                        OnChange: |-
                          =Switch(Self.Selected.Value,
                            "Catálogo", Navigate(Catalogo, ScreenTransition.None),
                            "Depósitos", Navigate(Depositos, ScreenTransition.None),
                            "Histórico", Navigate(Historico, ScreenTransition.None),
                            "Cadastros", Navigate(Cadastros, ScreenTransition.None)
                          )
            - Dashboard_Content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =24
                  Width: =Parent.Width
                  FillPortions: =0
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  PaddingBottom: =32
                Children:
                  - Dashboard_lblHeader:
                      Control: ModernText
                      Properties:
                        Text: ="Painel geral"
                        FontWeight: =FontWeight.Bold
                        Size: =28
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - Dashboard_lblSubheader:
                      Control: ModernText
                      Properties:
                        Text: ="Visão consolidada de todos os depósitos"
                        Size: =14
                        Color: =ColorTextSecondary
                        AutoHeight: =true
                  - Dashboard_KpiRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        Width: =Parent.Width
                        FillPortions: =0
                      Children:
                        - Dashboard_cardItens:
                            Control: ModernCard
                            Properties:
                              Title: =Text(varTotalItens)
                              Subtitle: ="Itens cadastrados"
                              Width: =220
                              Height: =100
                              FillPortions: =1
                              Fill: =ColorCard
                        - Dashboard_cardDepositos:
                            Control: ModernCard
                            Properties:
                              Title: =Text(varTotalDepositos)
                              Subtitle: ="Depósitos ativos"
                              Width: =220
                              Height: =100
                              FillPortions: =1
                              Fill: =ColorCard
                        - Dashboard_cardAlertas:
                            Control: ModernCard
                            Properties:
                              Title: =Text(CountRows(varItensBaixoEstoque))
                              Subtitle: ="Itens em alerta de estoque"
                              Width: =220
                              Height: =100
                              FillPortions: =1
                              Fill: =ColorCard
                  - Dashboard_AcoesRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        Width: =Parent.Width
                        FillPortions: =0
                      Children:
                        - Dashboard_btnNovaEntrada:
                            Control: Button
                            Properties:
                              Text: ="+ Nova Entrada"
                              BasePaletteColor: =ColorPrimary
                              Width: =200
                              Height: =48
                              FillPortions: =0
                              OnSelect: =Navigate(NovaEntrada, ScreenTransition.None)
                        - Dashboard_btnNovaSaida:
                            Control: Button
                            Properties:
                              Text: ="- Nova Saída"
                              BasePaletteColor: =ColorAlert
                              Width: =200
                              Height: =48
                              FillPortions: =0
                              OnSelect: =Navigate(NovaSaida, ScreenTransition.None)
                        - Dashboard_btnTransferencia:
                            Control: Button
                            Properties:
                              Text: ="Transferência"
                              BasePaletteColor: =ColorPrimaryDark
                              Width: =200
                              Height: =48
                              FillPortions: =0
                              OnSelect: =Navigate(Transferencia, ScreenTransition.None)
                  - Dashboard_lblAlertaHeader:
                      Control: ModernText
                      Properties:
                        Text: ="Estoque baixo"
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - Dashboard_galAlertas:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: =varItensBaixoEstoque
                        TemplateSize: =88
                        Width: =Parent.Width
                        Height: =CountRows(varItensBaixoEstoque) * 88
                        FillPortions: =0
                      Children:
                        - Dashboard_cardAlerta:
                            Control: ModernCard
                            Properties:
                              Title: =ThisItem.Nome
                              Subtitle: |-
                                ="SKU " & ThisItem.SKU & " · Saldo " & Text(ItemSaldoTotal(ThisItem.SKU)) & " " & ThisItem.UnidadeMedida & " (mínimo " & Text(ThisItem.EstoqueMinimo) & ")"
                              Width: =Parent.Width
                              Height: =76
                              Fill: =ColorCard
                              OnSelect: |-
                                =Set(varItemSelecionado, ThisItem);
                                Navigate(DetalheItem, ScreenTransition.None)
                        - Dashboard_badgeAlerta:
                            Control: Badge
                            Properties:
                              Content: ="Baixo"
                              X: =Parent.Width - 90
                              Y: =28
                              Width: =70
                              Height: =28
