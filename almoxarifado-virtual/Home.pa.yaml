Screens:
  Home:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varTotalItensEstoque, Sum(colSaldos, Quantidade));
        Set(varTotalItensBaixoEstoque, CountRows(Filter(colItens, ItemEstoqueBaixo(SKU))));
        Set(varMovimentacoesHoje, CountRows(Filter(colMovimentacoes, DateValue(DataHora) = Today())));
        Set(varTotalItensVencendo, CountRows(Filter(colSaldos, SaldoVencendoOuVencido(DataValidade))));
        Set(varValorTotalEstoque, Sum(colSaldos, Quantidade * ValorContratoItem(SKU)));
        Set(varTotalItensCatalogo, CountRows(colItens))
    Children:
      - Home_CardsRow2:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =123
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            LayoutWrap: =true
            Width: =1329
            X: =15
            Y: =349
          Children:
            - Home_cardInventario_Group:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 69, 120, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinWidth: =260
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =260
                Children:
                  - Home_iconInventario:
                      Control: Icon
                      Properties:
                        Height: =28
                        Icon: ="Cart"
                        IconColor: =RGBA(255, 255, 255, 1)
                        Width: =28
                  - Home_cardInventario:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =8
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        HeaderImage: =Blank()
                        Height: =100
                        Image: =Blank()
                        OnSelect: =Navigate(Depositos, ScreenTransition.None)
