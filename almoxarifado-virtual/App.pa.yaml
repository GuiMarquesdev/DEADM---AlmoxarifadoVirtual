App:
  Properties:
    StartScreen: =Dashboard
    Formulas: |-
      =// Paleta — Limpo & Profissional
      ColorBg = RGBA(247, 248, 250, 1);
      ColorCard = RGBA(255, 255, 255, 1);
      ColorPrimary = RGBA(21, 101, 129, 1);
      ColorPrimaryDark = RGBA(14, 74, 95, 1);
      ColorSuccess = RGBA(46, 160, 88, 1);
      ColorAlert = RGBA(214, 69, 44, 1);
      ColorTextPrimary = RGBA(40, 44, 48, 1);
      ColorTextSecondary = RGBA(120, 126, 133, 1);
      ColorBorder = RGBA(226, 229, 233, 1);

      // Funções auxiliares de estoque
      ItemSaldoTotal(sku: Text): Number =
        Sum(Filter(colSaldos, SKU = sku), Quantidade);

      ItemEstoqueMinimo(sku: Text): Number =
        LookUp(colItens, SKU = sku).EstoqueMinimo;

      ItemEstoqueBaixo(sku: Text): Boolean =
        ItemSaldoTotal(sku) < ItemEstoqueMinimo(sku);

      SaldoNoDeposito(sku: Text, deposito: Text): Number =
        Sum(Filter(colSaldos, SKU = sku && Deposito = deposito), Quantidade);

      DepositoSaldoTotal(deposito: Text): Number =
        Sum(Filter(colSaldos, Deposito = deposito), Quantidade);

      ProximoIdMovimentacao(): Number =
        Max(colMovimentacoes, ID) + 1;
    OnStart: |-
      =ClearCollect(
        colDepositos,
        {Nome: "Estoque no Cassange", Responsavel: "Carlos Mendes"},
        {Nome: "Estoque mínimo Cab", Responsavel: "Ana Ferreira"}
      );
      ClearCollect(
        colItens,
        {SKU: "MAT-001", Nome: "Cimento CP-II 50kg", Categoria: "Construção", UnidadeMedida: "SC", EstoqueMinimo: 50},
        {SKU: "MAT-002", Nome: "Vergalhão 10mm", Categoria: "Construção", UnidadeMedida: "BR", EstoqueMinimo: 100},
        {SKU: "MAT-003", Nome: "Luva de Segurança", Categoria: "EPI", UnidadeMedida: "PAR", EstoqueMinimo: 30},
        {SKU: "MAT-004", Nome: "Óleo Hidráulico 20L", Categoria: "Manutenção", UnidadeMedida: "GL", EstoqueMinimo: 10},
        {SKU: "MAT-005", Nome: "Parafuso Sextavado 1/2", Categoria: "Ferragens", UnidadeMedida: "CX", EstoqueMinimo: 20},
        {SKU: "MAT-006", Nome: "Capacete de Segurança", Categoria: "EPI", UnidadeMedida: "UN", EstoqueMinimo: 15}
      );
      ClearCollect(
