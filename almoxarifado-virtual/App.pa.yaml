App:
  Properties:
    Formulas: |-
      =// Paleta — Identidade Visual 2026
      ColorBg = RGBA(244, 246, 248, 1);
      ColorCard = RGBA(255, 255, 255, 1);
      ColorPrimary = RGBA(27, 94, 122, 1);
      ColorPrimaryDark = RGBA(15, 42, 61, 1);
      ColorAccent = RGBA(201, 164, 76, 1);
      ColorSuccess = RGBA(61, 122, 92, 1);
      ColorAlert = RGBA(179, 65, 58, 1);
      ColorTextPrimary = RGBA(26, 37, 48, 1);
      ColorTextSecondary = RGBA(92, 107, 120, 1);
      ColorBorder = RGBA(225, 230, 234, 1);

      // Fontes de dados normalizadas — espelham as listas do SharePoint com os
      // mesmos nomes de coleção/campo que o app já usava com dados mock
      // (SKU/Nome/Categoria em Itens, Nome em Depositos_1/Fornecedores/Setores,
      // Tipo como texto em Movimentacoes), para não reescrever as telas de leitura.
      // ShowColumns/AddColumns/DropColumns/RenameColumns não são suportadas por
      // este serviço de compilação em fórmulas nomeadas — ForAll com registro
      // literal é a alternativa que funciona.
      colItens = ForAll(Itens, {SKU: SKU, Nome: Nome, Categoria: Categoria, UnidadeMedida: UnidadeMedida, EstoqueMinimo: EstoqueMinimo, PrecoContrato: PrecoContrato, Descricao: Descricao});

      colDepositos = ForAll(Depositos_1, {ID: ID, Nome: Title, Responsavel: Responsavel});

      colSetores = ForAll(Setores, {ID: ID, Nome: Title});

      colFornecedores = ForAll(Fornecedores, {ID: ID, Nome: Title, Contato: Contato, Telefone: Telefone});

      colSaldos = Saldos;

      colMovimentacoes = ForAll(Movimentacoes, {ID: ID, Tipo: Tipo.Value, SKU: SKU, ItemNome: ItemNome, DepositoOrigem: DepositoOrigem, DepositoDestino: DepositoDestino, Quantidade: Quantidade, PrecoCusto: PrecoCusto, Motivo: Motivo, Solicitante: Solicitante, Fornecedor: Fornecedor, Usuario: Usuario, DataHora: DataHora, GuiaCodigo: GuiaCodigo});

      colGuias = ForAll(Guias, {ID: ID, Codigo: Codigo, DataHora: DataHora, Deposito: Deposito, Setor: Setor, DestinatarioNome: DestinatarioNome, DestinatarioDocumento: DestinatarioDocumento, Assinatura: Assinatura, Status: Status.Value});

      // Funções auxiliares de estoque
      ItemSaldoTotal(sku: Text): Number =
        Sum(Filter(colSaldos, SKU = sku), Quantidade);

      ItemEstoqueMinimo(sku: Text): Number =
        LookUp(colItens, SKU = sku).EstoqueMinimo;

      ItemEstoqueBaixo(sku: Text): Boolean =
        ItemSaldoTotal(sku) < ItemEstoqueMinimo(sku);

      SaldoNoDeposito(sku: Text, deposito: Text): Number =
        Sum(Filter(colSaldos, SKU = sku && Deposito = deposito), Quantidade);

      DepositoSaldoTotal(deposito: Text): Number =
        Sum(Filter(colSaldos, Deposito = deposito), Quantidade);

      // Funções auxiliares de vencimento
      StatusValidade(dataValidade: Date): Text =
        If(
          IsBlank(dataValidade), "",
          dataValidade < Today(), "Vencido",
          dataValidade <= DateAdd(Today(), 30, TimeUnit.Days), "Vence em breve",
          "OK"
        );

      SaldoVencendoOuVencido(dataValidade: Date): Boolean =
        !IsBlank(dataValidade) && dataValidade <= DateAdd(Today(), 30, TimeUnit.Days);

      // Funções auxiliares financeiras
      ValorContratoItem(sku: Text): Number =
        Coalesce(LookUp(colItens, SKU = sku).PrecoContrato, 0);
    OnStart: =Set(varUsuarioAtual, User().FullName)
    StartScreen: =Home
    Theme: =Blank()
