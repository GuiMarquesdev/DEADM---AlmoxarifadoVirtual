Screens:
  Catalogo:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varBuscaCatalogo, "");
        Set(varCategoriaFiltro, "Todas")
    Children:
      - Catalogo_Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =ColorBg
          Children:
            - Catalogo_NavBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  Width: =Parent.Width
                  Height: =64
                  FillPortions: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                  Fill: =ColorPrimaryDark
                Children:
                  - Catalogo_lblAppTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Almoxarifado Virtual"
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Color: =RGBA(255,255,255,1)
                        AutoHeight: =true
                  - Catalogo_navTabs:
                      Control: ModernTabList
                      Properties:
                        Items: |-
                          =Table({Value: "Dashboard"}, {Value: "Catálogo"}, {Value: "Depósitos"}, {Value: "Histórico"}, {Value: "Cadastros"})
                        Default: '={Value: "Catálogo"}'
                        Width: =520
                        Height: =40
                        FillPortions: =0
                        OnChange: |-
                          =Switch(Self.Selected.Value,
                            "Dashboard", Navigate(Dashboard, ScreenTransition.None),
                            "Depósitos", Navigate(Depositos, ScreenTransition.None),
                            "Histórico", Navigate(Historico, ScreenTransition.None),
                            "Cadastros", Navigate(Cadastros, ScreenTransition.None)
                          )
            - Catalogo_Content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  Width: =Parent.Width
                  FillPortions: =0
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  PaddingBottom: =32
                Children:
                  - Catalogo_lblHeader:
                      Control: ModernText
                      Properties:
                        Text: ="Catálogo de Itens"
                        FontWeight: =FontWeight.Bold
                        Size: =28
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - Catalogo_FiltroRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        Width: =Parent.Width
                        FillPortions: =0
                      Children:
                        - Catalogo_txtBusca:
                            Control: ModernTextInput
                            Properties:
                              Placeholder: ="Buscar por nome ou SKU..."
                              Default: =varBuscaCatalogo
                              Width: =320
                              Height: =44
                              FillPortions: =0
                              OnChange: =Set(varBuscaCatalogo, Self.Value)
                        - Catalogo_cboCategoria:
                            Control: ModernCombobox
                            Properties:
                              Items: |-
                                =Table({Value: "Todas"}, {Value: "Construção"}, {Value: "EPI"}, {Value: "Manutenção"}, {Value: "Ferragens"})
                              DefaultSelectedItems: |-
                                =Table({Value: "Todas"})
                              Width: =220
                              Height: =44
                              FillPortions: =0
                              OnChange: =Set(varCategoriaFiltro, Self.Selected.Value)
                  - Catalogo_galItens:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =Sort(
                            Filter(colItens,
                              (varCategoriaFiltro = "Todas" || Categoria = varCategoriaFiltro) &&
                              (varBuscaCatalogo = "" || Nome in varBuscaCatalogo || SKU in varBuscaCatalogo)
                            ),
                            Nome
                          )
                        TemplateSize: =92
                        Width: =Parent.Width
                        Height: =CountRows(Self.AllItems) * 92
                        FillPortions: =0
                      Children:
                        - Catalogo_cardItem:
                            Control: ModernCard
                            Properties:
                              Title: =ThisItem.Nome
                              Subtitle: |-
                                ="SKU " & ThisItem.SKU & " · " & ThisItem.Categoria & " · Saldo total " & Text(ItemSaldoTotal(ThisItem.SKU)) & " " & ThisItem.UnidadeMedida
                              Width: =Parent.Width
                              Height: =80
                              Fill: =ColorCard
                              OnSelect: |-
                                =Set(varItemSelecionado, ThisItem);
                                Navigate(DetalheItem, ScreenTransition.None)
                        - Catalogo_badgeStatus:
                            Control: Badge
                            Properties:
                              Content: =If(ItemEstoqueBaixo(ThisItem.SKU), "Baixo", "OK")
                              X: =Parent.Width - 90
                              Y: =26
                              Width: =70
                              Height: =28
