Screens:
  Depositos:
    Properties:
      Fill: =ColorBg
    Children:
      - Depositos_Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =ColorBg
          Children:
            - Depositos_NavBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  Width: =Parent.Width
                  Height: =64
                  FillPortions: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                  Fill: =ColorPrimaryDark
                Children:
                  - Depositos_lblAppTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Almoxarifado Virtual"
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Color: =RGBA(255,255,255,1)
                        AutoHeight: =true
                  - Depositos_navTabs:
                      Control: ModernTabList
                      Properties:
                        Items: |-
                          =Table({Value: "Dashboard"}, {Value: "Catálogo"}, {Value: "Depósitos"}, {Value: "Histórico"}, {Value: "Cadastros"})
                        Default: '={Value: "Depósitos"}'
                        Width: =520
                        Height: =40
                        FillPortions: =0
                        OnChange: |-
                          =Switch(Self.Selected.Value,
                            "Dashboard", Navigate(Dashboard, ScreenTransition.None),
                            "Catálogo", Navigate(Catalogo, ScreenTransition.None),
                            "Histórico", Navigate(Historico, ScreenTransition.None),
                            "Cadastros", Navigate(Cadastros, ScreenTransition.None)
                          )
            - Depositos_Content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  Width: =Parent.Width
                  FillPortions: =0
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  PaddingBottom: =32
                Children:
                  - Depositos_lblHeader:
                      Control: ModernText
                      Properties:
                        Text: ="Depósitos"
                        FontWeight: =FontWeight.Bold
                        Size: =28
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - Depositos_galDepositos:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: =colDepositos
                        TemplateSize: =92
                        Width: =Parent.Width
                        Height: =CountRows(Self.AllItems) * 92
                        FillPortions: =0
                      Children:
                        - Depositos_cardDeposito:
                            Control: ModernCard
                            Properties:
                              Title: =ThisItem.Nome
                              Subtitle: |-
                                ="Responsável: " & ThisItem.Responsavel & " · Saldo total: " & Text(DepositoSaldoTotal(ThisItem.Nome)) & " unidades"
                              Width: =Parent.Width
                              Height: =80
                              Fill: =ColorCard
                              OnSelect: |-
                                =Set(varDepositoSelecionado, ThisItem);
                                Navigate(DetalheDeposito, ScreenTransition.None)
