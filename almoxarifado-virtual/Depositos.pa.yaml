Screens:
  Depositos:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
    Children:
      - Depositos_Content:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244, 246, 248, 1)
            Height: =435
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =20
            PaddingBottom: =32
            PaddingLeft: =32
            PaddingRight: =32
            PaddingTop: =32
            Width: =1330
            X: =22
            Y: =120
          Children:
            - Depositos_lblHeader:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =ColorTextPrimary
                  FontWeight: =FontWeight.Bold
                  Size: =28
                  Text: ="Depósitos"
            - Depositos_galDepositos:
                Control: Gallery
                Variant: Vertical
                Properties:
                  FillPortions: =0
                  Height: =CountRows(Self.AllItems) * 92
                  Items: =colDepositos
                  TemplateSize: =92
                  Width: =Parent.Width
                Children:
                  - Depositos_cardDeposito:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =8
                        Fill: =ColorCard
                        HeaderImage: =Blank()
                        Height: =80
                        Image: =Blank()
                        OnSelect: |-
                          =Set(varDepositoSelecionado, ThisItem);
                          Navigate(DetalheDeposito, ScreenTransition.None)
                        Subtitle: |-
                          ="Responsável: " & ThisItem.Responsavel & " · Saldo total: " & Text(DepositoSaldoTotal(ThisItem.Nome)) & " unidades"
                        Title: =ThisItem.Nome
                        Width: =1240
                  - Depositos_badgeStatus:
                      Control: Badge
                      Properties:
                        Content: =If(CountRows(Filter(colItens, SaldoNoDeposito(SKU, ThisItem.Nome) < EstoqueMinimo)) > 0, "Atenção", "OK")
                        Height: =28
                        ThemeColor: =If(CountRows(Filter(colItens, SaldoNoDeposito(SKU, ThisItem.Nome) < EstoqueMinimo)) > 0, 'BadgeCanvas.ThemeColor'.Danger, 'BadgeCanvas.ThemeColor'.Success)
                        Width: =70
                        X: =1155
                        Y: =26
      - Depositos_NavBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =69
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutWrap: =true
            PaddingLeft: =24
            PaddingRight: =24
            Width: =Parent.Width
          Children:
            - Depositos_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Almoxarifado Virtual"
      - Depositos_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            OnSelect: =Navigate(Home, ScreenTransition.None)
            Text: ="< Voltar"
            Width: =90
            X: =1252
            Y: =14
