Screens:
  DetalheItem:
    Properties:
      Fill: =ColorBg
      OnVisible: =Set(varSaldosItem, Filter(colSaldos, SKU = varItemSelecionado.SKU))
    Children:
      - DetalheItem_lblNome:
          Control: ModernText
          Properties:
            Color: =ColorTextPrimary
            FontWeight: =FontWeight.Bold
            Height: =120
            Size: =26
            Text: =varItemSelecionado.Nome
            Width: =260
            X: =35
            Y: =105
      - DetalheItem_lblMeta:
          Control: ModernText
          Properties:
            Color: =ColorTextSecondary
            Height: =34
            Size: =14
            Text: ="Código " & varItemSelecionado.SKU & " · " & varItemSelecionado.Categoria.Value & " · Unidade " & varItemSelecionado.UnidadeMedida
            Width: =289
            X: =35
            Y: =230
      - DetalheItem_CardNivel:
          Control: ModernCard
          Properties:
            BorderRadius: =8
            Fill: =ColorCard
            HeaderImage: =Blank()
            Height: =78
            Image: =Blank()
            Subtitle: |-
              ="Estoque mínimo: " & Text(varItemSelecionado.EstoqueMinimo) & " " & varItemSelecionado.UnidadeMedida
            Title: |-
              ="Saldo total: " & Text(ItemSaldoTotal(varItemSelecionado.SKU)) & " " & varItemSelecionado.UnidadeMedida
            Width: =334
            X: =50
            Y: =275
      - DetalheItem_lblSaldosHeader:
          Control: ModernText
          Properties:
            Color: =ColorTextPrimary
            FontWeight: =FontWeight.Semibold
            Height: =38
            Size: =20
            Text: ="Saldo por depósito"
            Width: =198
            X: =35
            Y: =399
      - DetalheItem_btnHistorico:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =40
            Icon: ="ArrowRight"
            OnSelect: =Navigate(DetalheItemHistorico, ScreenTransition.None)
            Text: ="Ver histórico de movimentações "
            Width: =260
            X: =1077
            Y: =369
      - DetalheItem_TopBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =71
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =16
            PaddingLeft: =24
            Width: =Parent.Width
          Children:
            - DetalheItem_lblAppTitle:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255,255,255,1)
                  FontWeight: =FontWeight.Bold
                  Size: =18
                  Text: ="Detalhe do Item"
      - DetalheItem_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            Icon: ="ArrowLeft"
            OnSelect: =Navigate(Catalogo, ScreenTransition.None)
            Text: =" Voltar"
            Width: =164
            X: =1173
            Y: =15
      - DetalheItem_tblSaldos:
          Control: Table
          Properties:
            Height: =300
            Items: =varSaldosItem
            Width: =1302
            X: =35
            Y: =439
          Children:
            - Deposito1:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Deposito"
                  FieldName: ="Deposito"
                  FieldType: ="s"
                  Order: =1
            - Quantidade2:
                Control: TableDataField
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Quantidade"
                  FieldName: ="Quantidade"
                  FieldType: ="n"
                  Order: =2
