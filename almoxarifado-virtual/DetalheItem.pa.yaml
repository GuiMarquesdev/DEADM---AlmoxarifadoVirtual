Screens:
  DetalheItem:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varSaldosItem, Filter(colSaldos, SKU = varItemSelecionado.SKU));
        Set(varHistoricoItem, Sort(Filter(colMovimentacoes, SKU = varItemSelecionado.SKU), DataHora, SortOrder.Descending))
    Children:
      - DetalheItem_Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutOverflowY: =LayoutOverflow.Scroll
            Fill: =ColorBg
          Children:
            - DetalheItem_TopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  Width: =Parent.Width
                  Height: =64
                  FillPortions: =0
                  PaddingLeft: =24
                  LayoutGap: =16
                  Fill: =ColorPrimaryDark
                Children:
                  - DetalheItem_btnVoltar:
                      Control: Button
                      Properties:
                        Text: ="< Voltar"
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =RGBA(255,255,255,1)
                        Width: =90
                        Height: =40
                        FillPortions: =0
                        OnSelect: =Navigate(Catalogo, ScreenTransition.None)
                  - DetalheItem_lblAppTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Detalhe do Item"
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Color: =RGBA(255,255,255,1)
                        AutoHeight: =true
            - DetalheItem_Content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  Width: =Parent.Width
                  FillPortions: =0
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  PaddingBottom: =32
                Children:
                  - DetalheItem_lblNome:
                      Control: ModernText
                      Properties:
                        Text: =varItemSelecionado.Nome
                        FontWeight: =FontWeight.Bold
                        Size: =26
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - DetalheItem_lblMeta:
                      Control: ModernText
                      Properties:
                        Text: ="SKU " & varItemSelecionado.SKU & " · " & varItemSelecionado.Categoria & " · Unidade " & varItemSelecionado.UnidadeMedida
                        Size: =14
                        Color: =ColorTextSecondary
                        AutoHeight: =true
                  - DetalheItem_CardNivel:
                      Control: ModernCard
                      Properties:
                        Title: |-
                          ="Saldo total: " & Text(ItemSaldoTotal(varItemSelecionado.SKU)) & " " & varItemSelecionado.UnidadeMedida
                        Subtitle: |-
                          ="Estoque mínimo: " & Text(varItemSelecionado.EstoqueMinimo) & " " & varItemSelecionado.UnidadeMedida
                        Width: =420
                        Height: =120
                        Fill: =ColorCard
                  - DetalheItem_prgNivel:
                      Control: Progress
                      Properties:
                        Value: =Min(1, ItemSaldoTotal(varItemSelecionado.SKU) / (varItemSelecionado.EstoqueMinimo * 2))
                        Width: =420
                        Height: =12
                  - DetalheItem_lblSaldosHeader:
                      Control: ModernText
                      Properties:
                        Text: ="Saldo por depósito"
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - DetalheItem_tblSaldos:
                      Control: Table
                      Properties:
                        Items: =varSaldosItem
                        Width: =Parent.Width
                        Height: =CountRows(varSaldosItem) * 48 + 48
                        FillPortions: =0
                  - DetalheItem_lblHistoricoHeader:
                      Control: ModernText
                      Properties:
                        Text: ="Histórico de movimentações"
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Color: =ColorTextPrimary
                        AutoHeight: =true
                  - DetalheItem_tblHistorico:
                      Control: Table
                      Properties:
                        Items: =varHistoricoItem
                        Width: =Parent.Width
                        Height: =CountRows(varHistoricoItem) * 48 + 48
                        FillPortions: =0
