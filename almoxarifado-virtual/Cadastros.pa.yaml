Screens:
  Cadastros:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varAbaCadastro, "Itens");
        Set(varMostrarEdicaoItem, false)
    Children:
      - Cadastros_NavBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =71
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutWrap: =true
            PaddingLeft: =24
            PaddingRight: =24
            Width: =1366
      - Cadastros_txtSKUItem:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Código"
            Visible: =varAbaCadastro = "Itens"
            Width: =140
            X: =36
            Y: =218
      - Cadastros_btnAdicionarItem:
          Control: Button
          Properties:
            BasePaletteColor: =ColorPrimary
            Height: =44
            OnSelect: |-
              =If(
                Trim(Cadastros_txtSKUItem.Text) = "" || Trim(Cadastros_txtNomeItem.Text) = "",
                Notify("Informe o código e o nome do item.", NotificationType.Error),
                If(
                  !IsBlank(LookUp(Itens, SKU = Trim(Cadastros_txtSKUItem.Text))),
                  Notify("Já existe um item com esse código.", NotificationType.Error),
                  Patch(Itens, Defaults(Itens), {SKU: Trim(Cadastros_txtSKUItem.Text), Nome: Trim(Cadastros_txtNomeItem.Text), Categoria: Cadastros_cboCategoriaItem.Selected, UnidadeMedida: Trim(Cadastros_txtUnidadeItem.Text), EstoqueMinimo: Coalesce(Cadastros_txtEstoqueMinimoItem.Value, 0)});
                  Reset(Cadastros_txtSKUItem);
                  Reset(Cadastros_txtNomeItem);
                  Reset(Cadastros_cboCategoriaItem);
                  Reset(Cadastros_txtUnidadeItem);
                  Reset(Cadastros_txtEstoqueMinimoItem);
                  Notify("Item cadastrado com sucesso.", NotificationType.Success)
                )
              )
            Text: ="Adicionar"
            Visible: =varAbaCadastro = "Itens"
            Width: =140
            X: =866
            Y: =218
      - Cadastros_cboCategoriaItem:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            InputTextPlaceholder: ="Categoria"
            ItemDisplayText: =ThisItem.Value
            Items: |-
              =Table({Value: "Informática"}, {Value: "Elétrica"}, {Value: "Papelaria"}, {Value: "EPI"}, {Value: "Ferramentas"}, {Value: "Limpeza"}, {Value: "Copa"}, {Value: "Diversos"})
            Visible: =varAbaCadastro = "Itens"
            Width: =160
            X: =420
            Y: =218
      - Cadastros_txtEstoqueMinimoItem:
          Control: ModernNumberInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            HintText: ="Estoque mín."
            Visible: =varAbaCadastro = "Itens"
            Width: =110
            X: =744
            Y: =218
      - Cadastros_txtNomeSetor:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Nome do setor/solicitante"
            Visible: =varAbaCadastro = "Setores"
            Width: =260
            X: =36
            Y: =218
      - Cadastros_lblHeader:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextPrimary
            FontWeight: =FontWeight.Bold
            Size: =28
            Text: ="Cadastros Auxiliares"
            X: =36
            Y: =96
      - Cadastros_tabsAux:
          Control: ModernTabList
          Properties:
            Default: |-
              ={Value: "Itens"}
            Height: =40
            Items: |-
              =Table({Value: "Itens"}, {Value: "Setores"})
            OnChange: =Set(varAbaCadastro, Self.Selected.Value)
            Width: =320
            X: =36
            Y: =309
      - Cadastros_txtUnidadeItem:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: |-
              ="Unidade (ex.: Caixa)"
            Visible: =varAbaCadastro = "Itens"
            Width: =140
            X: =592
            Y: =218
      - Cadastros_lblAppTitle:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =RGBA(255,255,255,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Text: ="Almoxarifado Virtual"
            Width: =162
            X: =24
            Y: =5
      - Cadastros_txtNomeItem:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Nome do item"
            Visible: =varAbaCadastro = "Itens"
            Width: =220
            X: =188
            Y: =218
      - Cadastros_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            OnSelect: =Navigate(Home, ScreenTransition.None)
            Text: ="< Voltar"
            Width: =90
            X: =1252
            Y: =15
      - Cadastros_galItensCadastro:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =419
            Items: =colItens
            TemplateSize: =60
            Visible: =varAbaCadastro = "Itens"
            Width: =1330
            X: =36
            Y: =349
          Children:
            - Cadastros_cardItemCadastro:
                Control: ModernCard
                Properties:
                  BorderRadius: =8
                  Fill: =ColorCard
                  HeaderImage: =Blank()
                  Height: =57
                  Image: =Blank()
                  Subtitle: |-
                    ="Código " & ThisItem.SKU & " · " & ThisItem.Categoria.Value & " · Mínimo: " & Text(ThisItem.EstoqueMinimo) & " " & ThisItem.UnidadeMedida
                  Title: =ThisItem.Nome
                  Width: =1257
            - Cadastros_btnEditarItem:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorPrimary
                  Height: =44
                  Icon: ="Edit"
                  OnSelect: |-
                    =Set(varItemEditando, ThisItem);
                    Set(varMostrarEdicaoItem, true)
                  Text: =""
                  Width: =44
                  X: =1199
                  Y: =6
      - Cadastros_btnAdicionarSetor:
          Control: Button
          Properties:
            BasePaletteColor: =ColorPrimary
            Height: =44
            OnSelect: |-
              =If(
                Trim(Cadastros_txtNomeSetor.Text) = "",
                Notify("Informe o nome do setor.", NotificationType.Error),
                Patch(Setores, Defaults(Setores), {Title: Trim(Cadastros_txtNomeSetor.Text)});
                Reset(Cadastros_txtNomeSetor);
                Notify("Setor cadastrado com sucesso.", NotificationType.Success)
              )
            Text: ="Adicionar"
            Visible: =varAbaCadastro = "Setores"
            Width: =140
            X: =308
            Y: =218
      - Cadastros_galSetores:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =419
            Items: =colSetores
            TemplateSize: =56
            Visible: =varAbaCadastro = "Setores"
            Width: =1330
            X: =36
            Y: =349
          Children:
            - Cadastros_cardSetor:
                Control: ModernCard
                Properties:
                  BorderRadius: =8
                  Fill: =ColorCard
                  HeaderImage: =Blank()
                  Height: =56
                  Image: =Blank()
                  Title: =ThisItem.Nome
                  Width: =1282
            - Cadastros_btnExcluirSetor:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorAlert
                  Height: =44
                  Icon: ="Delete"
                  OnSelect: |-
                    =RemoveIf(Setores, ID = ThisItem.ID);
                    Notify("Setor removido.", NotificationType.Success)
                  Text: =""
                  Width: =44
                  X: =1227
                  Y: =6
      - Cadastros_OverlayEditarItem:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =800
            Visible: =varMostrarEdicaoItem
            Width: =1366
          Children:
            - Cadastros_boxEditarItem:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(230, 230, 230, 1)
                  Height: =470
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =460
                  X: =453
                  Y: =165
                Children:
                  - Cadastros_lblTituloEditarItem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: ="Editar item · " & varItemEditando.SKU
                        Width: =412
                        X: =24
                        Y: =20
                  - Cadastros_txtNomeEditar:
                      Control: ModernTextInput
                      Properties:
                        Default: =varItemEditando.Nome
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Placeholder: ="Nome do item"
                        Width: =412
                        X: =24
                        Y: =64
                  - Cadastros_cboCategoriaEditar:
                      Control: ModernCombobox
                      Properties:
                        DefaultSelectedItems: =Table(varItemEditando.Categoria)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        InputTextPlaceholder: ="Categoria"
                        ItemDisplayText: =ThisItem.Value
                        Items: |-
                          =Table({Value: "Informática"}, {Value: "Elétrica"}, {Value: "Papelaria"}, {Value: "EPI"}, {Value: "Ferramentas"}, {Value: "Limpeza"}, {Value: "Copa"}, {Value: "Diversos"})
                        Width: =412
                        X: =24
                        Y: =118
                  - Cadastros_txtUnidadeEditar:
                      Control: ModernTextInput
                      Properties:
                        Default: =varItemEditando.UnidadeMedida
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Placeholder: |-
                          ="Unidade (ex.: Caixa)"
                        Width: =412
                        X: =24
                        Y: =172
                  - Cadastros_txtEstoqueMinimoEditar:
                      Control: ModernNumberInput
                      Properties:
                        Default: =varItemEditando.EstoqueMinimo
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        HintText: ="Estoque mínimo"
                        Width: =412
                        X: =24
                        Y: =226
                  - Cadastros_txtPrecoContratoEditar:
                      Control: ModernNumberInput
                      Properties:
                        Default: =varItemEditando.PrecoContrato
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        HintText: ="Preço de contrato"
                        Width: =412
                        X: =24
                        Y: =280
                  - Cadastros_btnCancelarEdicaoItem:
                      Control: Button
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        Height: =44
                        OnSelect: =Set(varMostrarEdicaoItem, false)
                        Text: ="Cancelar"
                        Width: =198
                        X: =24
                        Y: =400
                  - Cadastros_btnSalvarEdicaoItem:
                      Control: Button
                      Properties:
                        BasePaletteColor: =ColorPrimary
                        Height: =44
                        OnSelect: |-
                          =If(
                            Trim(Cadastros_txtNomeEditar.Text) = "",
                            Notify("Informe o nome do item.", NotificationType.Error),
                            Patch(Itens, LookUp(Itens, SKU = varItemEditando.SKU), {Nome: Trim(Cadastros_txtNomeEditar.Text), Categoria: Cadastros_cboCategoriaEditar.Selected, UnidadeMedida: Trim(Cadastros_txtUnidadeEditar.Text), EstoqueMinimo: Coalesce(Cadastros_txtEstoqueMinimoEditar.Value, 0), PrecoContrato: Coalesce(Cadastros_txtPrecoContratoEditar.Value, 0)});
                            Set(varMostrarEdicaoItem, false);
                            Notify("Item atualizado com sucesso.", NotificationType.Success)
                          )
                        Text: ="Salvar alterações"
                        Width: =198
                        X: =238
                        Y: =400
