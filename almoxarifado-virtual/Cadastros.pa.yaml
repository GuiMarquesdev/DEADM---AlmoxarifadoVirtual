Screens:
  Cadastros:
    Properties:
      Fill: =ColorBg
      OnVisible: |-
        =Set(varAbaCadastro, "Itens");
        Set(varMostrarEdicaoItem, false)
    Children:
      - Cadastros_NavBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorPrimaryDark
            Height: =71
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutWrap: =true
            PaddingLeft: =24
            PaddingRight: =24
            Width: =1366
      - Cadastros_txtSKUItem:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Código"
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =140
            X: =36
            Y: =218
      - Cadastros_btnAdicionarItem:
          Control: Button
          Properties:
            BasePaletteColor: =ColorPrimary
            Height: =44
            OnSelect: |-
              =If(
                Trim(Cadastros_txtSKUItem.Text) = "" || Trim(Cadastros_txtNomeItem.Text) = "",
                Notify("Informe o código e o nome do item.", NotificationType.Error),
                If(
                  !IsBlank(LookUp(Itens, SKU = Trim(Cadastros_txtSKUItem.Text))),
                  Notify("Já existe um item com esse código.", NotificationType.Error),
                  Patch(Itens, Defaults(Itens), {SKU: Trim(Cadastros_txtSKUItem.Text), Nome: Trim(Cadastros_txtNomeItem.Text), Categoria: Cadastros_cboCategoriaItem.Selected, UnidadeMedida: Trim(Cadastros_txtUnidadeItem.Text), EstoqueMinimo: Coalesce(Cadastros_txtEstoqueMinimoItem.Value, 0), PrecoContrato: Coalesce(Cadastros_txtValorEstimadoItem.Value, 0), Descricao: Trim(Cadastros_txtDescricaoItem.Text)});
                  Reset(Cadastros_txtSKUItem);
                  Reset(Cadastros_txtNomeItem);
                  Reset(Cadastros_cboCategoriaItem);
                  Reset(Cadastros_txtUnidadeItem);
                  Reset(Cadastros_txtEstoqueMinimoItem);
                  Reset(Cadastros_txtValorEstimadoItem);
                  Reset(Cadastros_txtDescricaoItem);
                  Notify("Item cadastrado com sucesso.", NotificationType.Success)
                )
              )
            Text: ="Adicionar"
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =140
            X: =1021
            Y: =218
      - Cadastros_cboCategoriaItem:
          Control: ModernCombobox
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            InputTextPlaceholder: ="Categoria"
            ItemDisplayText: =ThisItem.Value
            Items: |-
              =Table({Value: "Informática"}, {Value: "Elétrica"}, {Value: "Papelaria"}, {Value: "EPI"}, {Value: "Ferramentas"}, {Value: "Limpeza"}, {Value: "Copa"}, {Value: "Diversos"})
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =160
            X: =420
            Y: =218
      - Cadastros_txtEstoqueMinimoItem:
          Control: ModernNumberInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            HintText: ="Estoque mín."
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =110
            X: =753
            Y: =218
      - Cadastros_txtNomeSetor:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Nome do setor/solicitante"
            Visible: =varAbaCadastro = "Setores"
            Width: =260
            X: =36
            Y: =218
      - Cadastros_lblHeader:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =ColorTextPrimary
            FontWeight: =FontWeight.Bold
            Size: =28
            Text: ="Cadastros Auxiliares"
            X: =36
            Y: =96
      - Cadastros_tabsAux:
          Control: ModernTabList
          Properties:
            Default: |-
              ={Value: "Itens"}
            Height: =40
            Items: |-
              =Table({Value: "Itens"}, {Value: "Setores"}, {Value: "Depósitos"}, {Value: "Fornecedores"})
            OnChange: =Set(varAbaCadastro, Self.Selected.Value)
            Width: =578
            X: =36
            Y: =325
      - Cadastros_txtUnidadeItem:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: |-
              ="Unidade (ex.: Caixa)"
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =140
            X: =592
            Y: =218
      - Cadastros_lblAppTitle:
          Control: ModernText
          Properties:
            AutoHeight: =true
            Color: =RGBA(255,255,255,1)
            FontWeight: =FontWeight.Bold
            Size: =18
            Text: ="Almoxarifado Virtual"
            Width: =162
            X: =24
            Y: =5
      - Cadastros_txtNomeItem:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Nome do item"
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =220
            X: =188
            Y: =218
      - Cadastros_btnVoltar:
          Control: Button
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Transparent
            FontColor: =RGBA(255,255,255,1)
            Height: =40
            OnSelect: =Navigate(Home, ScreenTransition.None)
            Text: ="< Voltar"
            Width: =90
            X: =1252
            Y: =15
      - Cadastros_galItensCadastro:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =391
            Items: =colItens
            TemplateSize: =60
            Visible: =varAbaCadastro = "Itens"
            Width: =1291
            X: =36
            Y: =365
          Children:
            - Cadastros_cardItemCadastro:
                Control: ModernCard
                Properties:
                  BorderRadius: =8
                  Fill: =ColorCard
                  HeaderImage: =Blank()
                  Height: =57
                  Image: =Blank()
                  Subtitle: |-
                    ="Código " & ThisItem.SKU & " · " & ThisItem.Categoria.Value & " · Mínimo: " & Text(ThisItem.EstoqueMinimo) & " " & ThisItem.UnidadeMedida
                  Title: =ThisItem.Nome
                  Width: =1257
            - Cadastros_btnEditarItem:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorPrimary
                  Height: =44
                  Icon: ="Edit"
                  OnSelect: |-
                    =Set(varItemEditando, ThisItem);
                    Set(varMostrarEdicaoItem, true)
                  Text: =""
                  Width: =44
                  X: =1199
                  Y: =6
      - Cadastros_btnAdicionarSetor:
          Control: Button
          Properties:
            BasePaletteColor: =ColorPrimary
            Height: =44
            OnSelect: |-
              =If(
                Trim(Cadastros_txtNomeSetor.Text) = "",
                Notify("Informe o nome do setor.", NotificationType.Error),
                Patch(Setores, Defaults(Setores), {Title: Trim(Cadastros_txtNomeSetor.Text)});
                Reset(Cadastros_txtNomeSetor);
                Notify("Setor cadastrado com sucesso.", NotificationType.Success)
              )
            Text: ="Adicionar"
            Visible: =varAbaCadastro = "Setores"
            Width: =140
            X: =308
            Y: =218
      - Cadastros_galSetores:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =419
            Items: =colSetores
            TemplateSize: =56
            Visible: =varAbaCadastro = "Setores"
            Width: =1330
            X: =36
            Y: =365
          Children:
            - Cadastros_cardSetor:
                Control: ModernCard
                Properties:
                  BorderRadius: =8
                  Fill: =ColorCard
                  HeaderImage: =Blank()
                  Height: =56
                  Image: =Blank()
                  Title: =ThisItem.Nome
                  Width: =1282
            - Cadastros_btnExcluirSetor:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorAlert
                  Height: =44
                  Icon: ="Delete"
                  OnSelect: |-
                    =RemoveIf(Setores, ID = ThisItem.ID);
                    Notify("Setor removido.", NotificationType.Success)
                  Text: =""
                  Width: =44
                  X: =1227
                  Y: =6
      - Cadastros_txtDescricaoItem:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Descrição (opcional)"
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =1092
            X: =36
            Y: =281
      - Cadastros_txtValorEstimadoItem:
          Control: ModernNumberInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            HintText: ="Valor estimado"
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =86
            X: =923
            Y: =218
      - Cadastros_btnAdicionarDeposito:
          Control: Button
          Properties:
            BasePaletteColor: =ColorPrimary
            Height: =44
            OnSelect: |-
              =If(
                Trim(Cadastros_txtNomeDeposito.Text) = "",
                Notify("Informe o nome do depósito.", NotificationType.Error),
                Patch(Depositos_1, Defaults(Depositos_1), {Title: Trim(Cadastros_txtNomeDeposito.Text), Responsavel: Trim(Cadastros_txtResponsavelDeposito.Text)});
                Reset(Cadastros_txtNomeDeposito);
                Reset(Cadastros_txtResponsavelDeposito);
                Notify("Depósito cadastrado com sucesso.", NotificationType.Success)
              )
            Text: ="Adicionar"
            Visible: =varAbaCadastro = "Depósitos"
            Width: =140
            X: =540
            Y: =218
      - Cadastros_btnAdicionarFornecedor:
