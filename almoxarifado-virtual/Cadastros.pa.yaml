                Reset(Cadastros_txtContatoFornecedor);
                Reset(Cadastros_txtTelefoneFornecedor);
                Notify("Fornecedor cadastrado com sucesso.", NotificationType.Success)
              )
            Text: ="Adicionar"
            Visible: =varAbaCadastro = "Fornecedores"
