                  FontColor: =ColorAlert
                  Height: =44
                  Icon: ="Delete"
                  OnSelect: |-
                    =RemoveIf(Depositos_1, ID = ThisItem.ID);
                    Notify("Depósito removido.", NotificationType.Success)
                  Text: =""
                  Width: =44
                  X: =1227
                  Y: =6
      - Cadastros_txtNomeFornecedor:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Nome do fornecedor"
            Visible: =varAbaCadastro = "Fornecedores"
            Width: =220
            X: =36
            Y: =218
      - Cadastros_txtTelefoneFornecedor:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Telefone"
            Visible: =varAbaCadastro = "Fornecedores"
            Width: =180
            X: =500
            Y: =218
      - Cadastros_galFornecedoresCadastro:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =419
            Items: =colFornecedores
            TemplateSize: =56
            Visible: =varAbaCadastro = "Fornecedores"
            Width: =1330
            X: =36
            Y: =365
          Children:
            - Cadastros_cardFornecedorCadastro:
                Control: ModernCard
                Properties:
