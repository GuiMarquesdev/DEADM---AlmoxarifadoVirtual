            - Cadastros_btnExcluirFornecedor:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =ColorAlert
                  Height: =44
                  Icon: ="Delete"
                  OnSelect: |-
                    =RemoveIf(Fornecedores, ID = ThisItem.ID);
                    Notify("Fornecedor removido.", NotificationType.Success)
                  Text: =""
                  Width: =44
                  X: =1227
                  Y: =6
      - Label3:
          Control: Label
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
