              "
            Visible: =varAbaCadastro = "Itens" && !varMostrarEdicaoItem
            Width: =111
            X: =923
            Y: =150
      - Cadastros_OverlayEditarItem:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =800
            Visible: =varMostrarEdicaoItem
            Width: =1366
          Children:
            - Cadastros_boxEditarItem:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(230, 230, 230, 1)
                  Height: =524
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =460
                  X: =453
                  Y: =165
                Children:
                  - Cadastros_lblTituloEditarItem:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: ="Editar item · " & varItemEditando.SKU
                        Width: =412
                        X: =24
                        Y: =20
                  - Cadastros_txtNomeEditar:
                      Control: ModernTextInput
                      Properties:
                        Default: =varItemEditando.Nome
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Placeholder: ="Nome do item"
                        Width: =412
                        X: =24
                        Y: =64
                  - Cadastros_cboCategoriaEditar:
                      Control: ModernCombobox
                      Properties:
                        DefaultSelectedItems: =Table(varItemEditando.Categoria)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        InputTextPlaceholder: ="Categoria"
                        ItemDisplayText: =ThisItem.Value
                        Items: |-
                          =Table({Value: "Informática"}, {Value: "Elétrica"}, {Value: "Papelaria"}, {Value: "EPI"}, {Value: "Ferramentas"}, {Value: "Limpeza"}, {Value: "Copa"}, {Value: "Diversos"})
                        Width: =412
                        X: =24
                        Y: =118
                  - Cadastros_txtUnidadeEditar:
                      Control: ModernTextInput
                      Properties:
                        Default: =varItemEditando.UnidadeMedida
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Placeholder: |-
                          ="Unidade (ex.: Caixa)"
                        Width: =412
                        X: =24
                        Y: =172
                  - Cadastros_txtEstoqueMinimoEditar:
                      Control: ModernNumberInput
                      Properties:
                        Default: =varItemEditando.EstoqueMinimo
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        HintText: ="Estoque mínimo"
                        Width: =412
                        X: =24
                        Y: =226
                  - Cadastros_txtPrecoContratoEditar:
                      Control: ModernNumberInput
                      Properties:
                        Default: =varItemEditando.PrecoContrato
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        HintText: ="Preço de contrato"
                        Width: =386
                        X: =50
                        Y: =280
                  - Cadastros_txtDescricaoEditar:
                      Control: ModernTextInput
                      Properties:
                        Default: =varItemEditando.Descricao
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Placeholder: ="Descrição (opcional)"
                        Width: =412
                        X: =24
                        Y: =334
                  - Cadastros_btnCancelarEdicaoItem:
                      Control: Button
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        Height: =44
                        OnSelect: =Set(varMostrarEdicaoItem, false)
                        Text: ="Cancelar"
                        Width: =198
                        X: =24
                        Y: =454
                  - Cadastros_btnSalvarEdicaoItem:
                      Control: Button
                      Properties:
                        BasePaletteColor: =ColorPrimary
                        Height: =44
                        OnSelect: |-
                          =If(
                            Trim(Cadastros_txtNomeEditar.Text) = "",
                            Notify("Informe o nome do item.", NotificationType.Error),
                            Patch(Itens, LookUp(Itens, SKU = varItemEditando.SKU), {Nome: Trim(Cadastros_txtNomeEditar.Text), Categoria: Cadastros_cboCategoriaEditar.Selected, UnidadeMedida: Trim(Cadastros_txtUnidadeEditar.Text), EstoqueMinimo: Coalesce(Cadastros_txtEstoqueMinimoEditar.Value, 0), PrecoContrato: Coalesce(Cadastros_txtPrecoContratoEditar.Value, 0), Descricao: Trim(Cadastros_txtDescricaoEditar.Text)});
                            Set(varMostrarEdicaoItem, false);
                            Notify("Item atualizado com sucesso.", NotificationType.Success)
                          )
                        Text: ="Salvar alterações"
                        Width: =198
                        X: =238
                        Y: =454
                  - Cadastros_lblPrecoContratoRS:
                      Control: ModernText
                      Properties:
                        Color: =RGBA(0, 0, 0, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =14
                        Text: ="R$"
                        Width: =28
