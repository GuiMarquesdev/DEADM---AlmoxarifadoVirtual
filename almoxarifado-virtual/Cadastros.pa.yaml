                Trim(Cadastros_txtNomeFornecedor.Text) = "",
                Notify("Informe o nome do fornecedor.", NotificationType.Error),
                Patch(Fornecedores, Defaults(Fornecedores), {Title: Trim(Cadastros_txtNomeFornecedor.Text), Contato: Trim(Cadastros_txtContatoFornecedor.Text), Telefone: Trim(Cadastros_txtTelefoneFornecedor.Text)});
