            Visible: =varAbaCadastro = "Fornecedores"
            Width: =220
            X: =268
            Y: =218
      - Cadastros_txtNomeDeposito:
          Control: ModernTextInput
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Placeholder: ="Nome do depósito"
            Visible: =varAbaCadastro = "Depósitos"
            Width: =260
